# Render Blueprint for Automation Center.
#
# Deploys the full production stack:
#
#   automation-center-db          Postgres (control plane data)
#   automation-center-api         FastAPI backend      (public, HTTPS)
#   automation-center-n8n         n8n                  (public: needs webhooks)
#   automation-center-playwright  scraper sidecar      (PRIVATE, internal only)
#
# The frontend lives on Vercel and talks to automation-center-api over HTTPS.
#
# Why these service types:
#   * the API is a long-running web service (not serverless) so the metrics hub
#     and n8n polling keep running, and WebSockets work natively over wss;
#   * n8n must be public because Gmail/Calendar and any inbound webhook have to
#     reach it, and because you open its editor in a browser;
#   * Playwright is a private service: nothing outside the Render network has
#     any business reaching a headless browser, so it is never published.
#
# One-time setup (needs a human — browser login):
#   1. Push this repo to GitHub (Render deploys from a connected Git repo).
#   2. Render Dashboard -> New -> Blueprint -> pick the repo -> Apply.
#   3. Fill in the env vars flagged `sync: false` in the Dashboard.
#   4. Set AC_CORS_ORIGINS to the real Vercel origin.
#   5. Open the n8n service URL, create the owner account, then
#      Settings -> n8n API -> create an API key.
#   6. Paste that key into Automation Center -> Settings -> Services -> n8n.
#      (It is stored encrypted in Postgres and applies on the next health
#      check — no redeploy, and no need to touch the Render dashboard again.)
# Full runbook: docs/CLOUD-DEPLOYMENT.md
#
# No secret values live in this file.

databases:
  - name: automation-center-db
    databaseName: automation_center
    user: automation
    plan: basic-256mb          # `free` works for a trial (expires after 30 days)
    region: frankfurt          # closest to the project TZ (Europe/Madrid)
    postgresMajorVersion: "16"

services:
  # ------------------------------------------------------------------ API ----
  - type: web
    name: automation-center-api
    runtime: docker
    region: frankfurt
    plan: starter              # NOT `free`: free instances sleep after 15 min and
                               # would kill the metrics hub + n8n polling loop.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .           # repo root: the image's test stage checks the
                               # workflow JSONs, which live outside ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: AC_ENVIRONMENT
        value: production
      - key: AC_RUN_MIGRATIONS
        value: "1"             # entrypoint runs `alembic upgrade head` on boot
      - key: AC_ENSURE_DATABASE
        value: "0"             # Render pre-creates the DB and forbids CREATE DATABASE
      - key: AC_DATABASE_URL
        fromDatabase:
          name: automation-center-db
          property: connectionString   # config.py pins the +psycopg dialect
      - key: AC_JWT_SECRET
        generateValue: true            # 256-bit random, satisfies the >=32-char rule
      - key: AC_CREDENTIAL_ENCRYPTION_KEY
        sync: false                    # MUST be a Fernet key (44-char base64url).
                                       # Generate + paste in the Dashboard:
                                       #   python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"
                                       # Also required to store service API keys
                                       # from the web panel.
      - key: AC_CORS_ORIGINS
        sync: false                    # set to https://tdrassistantproject.vercel.app
                                       # (exact frontend origin; `*` is rejected because
                                       #  the API sends Allow-Credentials: true)
      - key: AC_CORS_ORIGIN_REGEX
        sync: false                    # optional: ^https://<project>-[a-z0-9-]+\.vercel\.app$
                                       # to also allow your own Vercel preview URLs
      - key: AC_TRUSTED_PROXIES
        value: "10.0.0.0/8"            # Render terminates TLS in front of the app;
                                       # trust its private range so X-Forwarded-For
                                       # is used for rate-limiting
      # --- integrations -------------------------------------------------------
      # These are the *fallback*. Anything set from the web panel is stored in
      # the `service_configs` table and takes precedence, so day-to-day changes
      # never need a redeploy.
      - key: AC_N8N_BASE_URL
        fromService:
          name: automation-center-n8n
          type: web
          property: host               # https://automation-center-n8n.onrender.com
      - key: AC_N8N_API_KEY
        sync: false                    # created inside n8n after its first boot;
                                       # easier to paste into the web panel instead
      - key: AC_PLAYWRIGHT_BASE_URL
        fromService:
          name: automation-center-playwright
          type: pserv
          property: hostport           # internal host:port, never public
      # --- AI providers -------------------------------------------------
      # Every one of these is optional. The panel (Settings -> Artificial
      # Intelligence) writes the same settings into `service_configs`, which
      # takes precedence, so a provider can be added or swapped with no
      # redeploy. They are declared here only so an operator *may* seed them.
      #
      # Empty AC_AI_PROVIDER = decide automatically: the first provider with a
      # credential, in the order NVIDIA NIM -> OpenRouter -> Gemini.
      - key: AC_AI_PROVIDER
        sync: false
      - key: AC_AI_MODEL
        sync: false
      - key: AC_AI_FALLBACK_PROVIDER
        sync: false
      # Shared secret n8n presents to POST /api/ai/generate. Generate it from
      # the panel and paste the same value into the n8n service below.
      - key: AC_AI_SERVICE_TOKEN
        sync: false
      - key: AC_NVIDIA_NIM_API_KEY
        sync: false                    # build.nvidia.com -> Get API Key
      - key: AC_NVIDIA_NIM_BASE_URL
        sync: false                    # only for a self-hosted NIM
      - key: AC_NVIDIA_NIM_MODEL
        sync: false
      - key: AC_OPENROUTER_API_KEY
        sync: false                    # openrouter.ai/keys
      - key: AC_OPENROUTER_MODEL
        sync: false
      # Gemini stays supported; it is simply no longer required.
      - key: AC_GEMINI_API_KEY
        sync: false                    # Google AI Studio -> Get API key
      - key: AC_GEMINI_MODEL
        value: gemini-2.5-flash

  # ------------------------------------------------------------------ n8n ----
  - type: web
    name: automation-center-n8n
    runtime: image
    region: frankfurt
    plan: starter                      # n8n needs a persistent instance, not a
                                       # sleeping free one: schedules must fire.
    image:
      url: docker.io/n8nio/n8n:1.121.3
    healthCheckPath: /healthz
    # n8n keeps its config (and the encryption key file) on disk. Workflow and
    # execution data live in Postgres, so this disk stays small.
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 1
    envVars:
      # n8n's own storage, on the same Postgres instance as the control plane.
      # n8n creates its own tables; it does not touch Automation Center's.
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: automation-center-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: automation-center-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: automation-center-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: automation-center-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: automation-center-db
          property: password
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"                 # Render's managed Postgres uses its own CA
      # Encrypts stored n8n credentials. Generated once and kept by Render —
      # losing it makes every credential inside n8n unreadable, so do not rotate
      # it casually.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_PORT
        value: "5678"
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        fromService:
          name: automation-center-n8n
          type: web
          property: hostport
      - key: WEBHOOK_URL
        fromService:
          name: automation-center-n8n
          type: web
          property: host
      - key: N8N_EDITOR_BASE_URL
        fromService:
          name: automation-center-n8n
          type: web
          property: host
      - key: GENERIC_TIMEZONE
        value: Europe/Madrid
      - key: TZ
        value: Europe/Madrid
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"
      - key: N8N_RUNNERS_ENABLED
        value: "true"
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - key: EXECUTIONS_DATA_SAVE_ON_ERROR
        value: all
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: all
      - key: EXECUTIONS_TIMEOUT
        value: "300"
      # How the workflows reach the platform's AI API. They no longer carry a
      # provider key: they POST to the backend, which picks the provider.
      # Full origin of the backend, WITH the scheme, e.g.
      #   https://automation-center-api.onrender.com
      # (`fromService.property: host` yields a bare hostname, which is not a
      # usable base URL, so this is set by hand.)
      - key: AC_API_URL
        sync: false
      # Same value as AC_AI_SERVICE_TOKEN on the backend service above.
      - key: AC_SERVICE_TOKEN
        sync: false
      # Consumed by the workflows' HTTP nodes.
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_NOTICIAS_TOKEN
        sync: false
      - key: TELEGRAM_TOKEN_MARCA
        sync: false
      - key: TELEGRAM_TOKEN_LABORAL
        sync: false
      - key: TELEGRAM_TOKEN_EMAIL
        sync: false
      - key: PLAYWRIGHT_BASE_URL
        fromService:
          name: automation-center-playwright
          type: pserv
          property: hostport

  # ----------------------------------------------------------- playwright ----
  # Private service: reachable only from inside the Render network. A headless
  # browser that fetches arbitrary URLs must never be exposed to the internet.
  - type: pserv
    name: automation-center-playwright
    runtime: docker
    region: frankfurt
    plan: starter                      # Chromium needs more than the free tier
    dockerfilePath: ./playwright/Dockerfile
    dockerContext: ./playwright
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "3000"
      - key: TZ
        value: Europe/Madrid
