name: release

# Matriz de build de todos los artefactos. Se dispara al empujar un tag vX.Y.Z
# o manualmente. NOTA: requiere runners de GitHub; no puede ejecutarse en local.
#
# Gate de validacion: el job `test` corre primero; portable / deb / windows-exe
# dependen de el (`needs: test`) y `release` depende de los cuatro. Si `test`
# falla no se empaqueta nada y no se publica ninguna Release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # GATE: validacion obligatoria. Todo lo demas depende de este job.
  # Usa los comandos reales del proyecto (pyproject `.[dev]`, scripts de
  # frontend/package.json, Dockerfile `--target test`). No inventa comandos.
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Coherencia de version (VERSION == backend == frontend)
        run: |
          v=$(tr -d ' \t\r\n' < VERSION)
          b=$(grep -E '^version *= *"' backend/pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          f=$(node -p "require('./frontend/package.json').version")
          echo "VERSION=$v  backend/pyproject.toml=$b  frontend/package.json=$f"
          if [ "$v" != "$b" ] || [ "$v" != "$f" ]; then
            echo "::error::version mismatch (VERSION=$v backend=$b frontend=$f)"
            exit 1
          fi

      - name: Sintaxis de los scripts PowerShell (AST parse)
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1 -Path installer,build,scripts | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count) {
              $bad++
              Write-Host "FAIL  $($_.FullName)"
              $errors | ForEach-Object { Write-Host "      $($_.Message)" }
            } else {
              Write-Host "ok    $($_.Name)"
            }
          }
          if ($bad) { throw "$bad script(s) PowerShell con errores de sintaxis" }

      - name: docker compose config
        run: docker compose config -q

      # ---- Backend ------------------------------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backend · instalar dependencias
        working-directory: backend
        run: pip install ".[dev]"

      - name: Backend · pytest
        working-directory: backend
        run: pytest

      - name: Backend · pip check
        run: pip check

      - name: Backend · docker build --target test
        run: docker build --target test -f backend/Dockerfile .

      # ---- Frontend ---------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend · npm ci
        working-directory: frontend
        run: npm ci

      - name: Frontend · lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend · typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend · test
        working-directory: frontend
        run: npm run test

      - name: Frontend · build
        working-directory: frontend
        run: npm run build

  # -------------------------------------------------------------------------
  # Paquetes portables (zip / tar.gz). El payload es independiente de arch.
  # -------------------------------------------------------------------------
  portable:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portables
        run: |
          chmod +x build/build.sh installer/*.sh
          sudo apt-get update && sudo apt-get install -y zip
          ./build/build.sh windows-x64 windows-arm64 linux-x64 linux-arm64 raspberrypi-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: portable
          path: dist/*

  # -------------------------------------------------------------------------
  # .deb para Debian / Ubuntu / Raspberry Pi OS. Usa nfpm.
  # -------------------------------------------------------------------------
  deb:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install nfpm
        run: |
          curl -sfL https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(tr -d ' \n' < VERSION)
          mkdir -p dist pkgroot/opt/automation-platform
          tar -c --exclude='./.git' --exclude='./.env' --exclude='./dist' \
              --exclude='./pkgroot' --exclude='./node_modules' \
              --exclude='./output/*/*.md' --exclude='./config/user_profile.json' . \
            | tar -x -C pkgroot/opt/automation-platform
          chmod +x build/deb/postinstall.sh installer/*.sh
          cat > nfpm.yaml <<YAML
          name: automation-platform
          arch: ${ARCH}
          version: ${VERSION}
          maintainer: "Automation Platform"
          description: "Asistente personal (n8n + Docker). Instalador y stack local."
          section: utils
          priority: optional
          depends:
            - "docker.io | docker-ce"
            - "docker-compose-plugin | docker-compose-v2"
          contents:
            - src: ./pkgroot/opt/automation-platform
              dst: /opt/automation-platform
            - src: ./installer/install.sh
              dst: /usr/bin/automation-platform-install
              file_info:
                mode: 0755
          scripts:
            postinstall: ./build/deb/postinstall.sh
          YAML
          nfpm package -p deb -t "dist/automation-platform-${VERSION}-${ARCH}.deb"
          ( cd dist && sha256sum *.deb > "SHA256SUMS-deb-${ARCH}.txt" )
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*

  # -------------------------------------------------------------------------
  # Instalador nativo AutomationCenter-Setup.exe con Inno Setup 6.
  # Un único .exe (x64 + ARM64): el payload es docker-compose, independiente
  # de arquitectura; bootstrap.ps1 detecta la plataforma en tiempo de ejecución.
  # Firma opcional: si el secret WINDOWS_PFX_BASE64 existe.
  # -------------------------------------------------------------------------
  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compilar AutomationCenter-Setup.exe
        shell: pwsh
        run: pwsh -File build/build-exe.ps1
      - name: Firmar (si hay certificado)
        shell: pwsh
        continue-on-error: true
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_PFX_BASE64) {
            Write-Warning 'Sin WINDOWS_PFX_BASE64/PASSWORD: AutomationCenter-Setup.exe queda SIN FIRMAR.'
            Write-Output '::warning title=EXE sin firmar::No hay certificado de firma de codigo (secrets WINDOWS_PFX_BASE64 / WINDOWS_PFX_PASSWORD).'
            exit 0
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\c.pfx", [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st.FullName sign /f "$env:RUNNER_TEMP\c.pfx" /p $env:WINDOWS_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\AutomationCenter-Setup.exe
          Remove-Item "$env:RUNNER_TEMP\c.pfx" -Force -ErrorAction SilentlyContinue
          Get-FileHash dist\AutomationCenter-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  AutomationCenter-Setup.exe" } |
            Set-Content dist\AutomationCenter-Setup.exe.sha256
      - name: Comprobar EXE + checksum
        shell: pwsh
        run: |
          $exe = 'dist\AutomationCenter-Setup.exe'
          $sum = "$exe.sha256"
          if (-not (Test-Path $exe)) { throw "no se genero $exe" }
          if (-not (Test-Path $sum)) { throw "no se genero $sum" }
          $expected = ((Get-Content $sum -Raw) -split '\s+')[0].Trim().ToLower()
          $actual   = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "checksum no coincide (sha256 fichero=$actual, .sha256=$expected)" }
          Write-Host ("OK  sha256=$actual  {0:N0} bytes" -f (Get-Item $exe).Length)
      - name: Comprobar que el .exe arranca
        shell: pwsh
        run: |
          $p = Start-Process dist\AutomationCenter-Setup.exe -Wait -PassThru -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',
            "/DIR=$env:RUNNER_TEMP\ac", '/TASKS=!runsetup,!trayautostart,!desktopicon',
            "/LOG=$env:RUNNER_TEMP\ac-setup.log")
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\ac-setup.log" -Tail 40; throw "Setup exit $($p.ExitCode)" }
          if (-not (Test-Path "$env:RUNNER_TEMP\ac\installer\windows\scripts\bootstrap.ps1")) { throw 'faltan ficheros tras instalar' }
          Start-Process "$env:RUNNER_TEMP\ac\unins000.exe" -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES'
          Write-Host 'OK: instala y desinstala en silencio'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/AutomationCenter-Setup.exe*

  # -------------------------------------------------------------------------
  release:
    needs: [test, portable, deb, windows-exe]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: all/*
          generate_release_notes: true
