name: personal-assistant

services:
  postgres:
    image: postgres:16-alpine
    container_name: pa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - assistant
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  n8n:
    image: n8nio/n8n:1.121.3
    container_name: pa-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      # --- n8n <-> Postgres (n8n's own data) ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # --- n8n runtime ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # El Code node y las expresiones necesitan leer variables de entorno ($env).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_LOG_OUTPUT: console
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_TIMEOUT: "300"
      # Allow Code nodes to read the mounted profile files (local, single-user).
      NODE_FUNCTION_ALLOW_BUILTIN: "fs"
      # --- how the workflows reach the platform's AI API ---
      # The workflows no longer hold a provider key: they POST to the backend,
      # which decides the provider (NVIDIA NIM / OpenRouter / Gemini) from the
      # panel. AC_SERVICE_TOKEN is generated in Settings -> Artificial
      # Intelligence and pasted into .env.
      AC_API_URL: ${AC_API_URL:-http://backend:8080}
      AC_SERVICE_TOKEN: ${AC_SERVICE_TOKEN:-}
      # Which stored profile the automations run with. The visual picker
      # writes it to Postgres; the workflows fetch it at run time from
      # /api/profiles/runtime, so there is no file to keep in step.
      AC_PROFILE_ID: ${AC_PROFILE_ID:-}
      # --- secrets consumed by workflow HTTP nodes ---
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      # Un bot de Telegram por workflow (ver CREDENCIALES.md).
      TELEGRAM_NOTICIAS_TOKEN: ${TELEGRAM_NOTICIAS_TOKEN:-}
      TELEGRAM_TOKEN_MARCA: ${TELEGRAM_TOKEN_MARCA:-}
      TELEGRAM_TOKEN_LABORAL: ${TELEGRAM_TOKEN_LABORAL:-}
      TELEGRAM_TOKEN_EMAIL: ${TELEGRAM_TOKEN_EMAIL:-}
      PLAYWRIGHT_BASE_URL: http://playwright:3000
      PROFILE_API_URL: http://profile:7777
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config:/files/config:ro
      - ./workflows:/files/workflows:ro
      - ./output:/files/output
    depends_on:
      postgres:
        condition: service_healthy
      playwright:
        condition: service_healthy
      # The workflows call the platform's AI API, so n8n must not start
      # answering triggers before the backend can serve /api/ai/generate.
      backend:
        condition: service_healthy
    networks:
      - assistant
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  playwright:
    build:
      context: ./playwright
    image: pa-playwright-scraper:local
    container_name: pa-playwright
    restart: unless-stopped
    environment:
      PORT: 3000
      TZ: ${TZ}
    networks:
      - assistant
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 15s

  profile:
    build:
      context: ./profile
    image: pa-profile:local
    container_name: pa-profile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROFILE_PORT:-7777}:7777"
    environment:
      PORT: 7777
      CONFIG_DIR: /config
      TZ: ${TZ}
    volumes:
      - ./config:/config
    networks:
      - assistant
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:7777/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 10s

  # --- Automation Center control plane (FastAPI) ---
  backend:
    build:
      context: ./backend
    image: pa-automation-center-backend:local
    container_name: pa-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      AC_ENVIRONMENT: ${AC_ENVIRONMENT:-production}
      AC_DEBUG: "false"
      AC_API_PORT: 8080
      AC_CORS_ORIGINS: ${AC_CORS_ORIGINS:-http://localhost:3000}
      # Optional: allow Vercel preview URLs for one project (scoped regex, never ".*").
      AC_CORS_ORIGIN_REGEX: ${AC_CORS_ORIGIN_REGEX:-}
      # Automation Center's own DB, on the same postgres server as n8n's.
      AC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/automation_center
      AC_JWT_SECRET: ${AC_JWT_SECRET}
      AC_CREDENTIAL_ENCRYPTION_KEY: ${AC_CREDENTIAL_ENCRYPTION_KEY}
      AC_N8N_BASE_URL: ${AC_N8N_BASE_URL:-http://n8n:5678}
      # Prefer AC_N8N_API_KEY (from .env); fall back to a plain N8N_API_KEY.
      AC_N8N_API_KEY: ${AC_N8N_API_KEY:-${N8N_API_KEY:-}}
      # Playwright sidecar on the compose network — the monitor probes it.
      # A stand-alone deploy (Render) leaves it unset -> NOT_CONFIGURED.
      AC_PLAYWRIGHT_BASE_URL: ${AC_PLAYWRIGHT_BASE_URL:-http://playwright:3000}
      # NOTE: the monitor's PROFILE state is not an HTTP probe. It reads the
      # `profiles` table and checks the data is actually usable, so there is no
      # AC_PROFILE_BASE_URL here. The `profile` container below is a local
      # helper that maintains config/user_profile.json for the n8n Code nodes.
      # --- AI providers -------------------------------------------------
      # All optional: the panel writes the same settings into `service_configs`,
      # which wins over the environment. Leave every key empty and the platform
      # simply reports AI as NOT CONFIGURED until someone fills it in from
      # Settings -> Artificial Intelligence.
      #
      # Empty AC_AI_PROVIDER means "decide automatically": the first provider
      # holding a credential, in the order NVIDIA NIM -> OpenRouter -> Gemini.
      # That is what keeps an existing GEMINI_API_KEY-only install working.
      AC_AI_PROVIDER: ${AC_AI_PROVIDER:-}
      AC_AI_MODEL: ${AC_AI_MODEL:-}
      AC_AI_FALLBACK_PROVIDER: ${AC_AI_FALLBACK_PROVIDER:-}
      AC_AI_SERVICE_TOKEN: ${AC_SERVICE_TOKEN:-}
      AC_NVIDIA_NIM_API_KEY: ${AC_NVIDIA_NIM_API_KEY:-${NVIDIA_NIM_API_KEY:-}}
      AC_NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-}
      AC_NVIDIA_NIM_MODEL: ${NVIDIA_NIM_MODEL:-}
      AC_OPENROUTER_API_KEY: ${AC_OPENROUTER_API_KEY:-${OPENROUTER_API_KEY:-}}
      AC_OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      AC_OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      # Gemini stays supported; it is simply no longer required.
      AC_GEMINI_API_KEY: ${AC_GEMINI_API_KEY:-${GEMINI_API_KEY:-}}
      AC_GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AC_COMPOSE_PROJECT: personal-assistant
      TZ: ${TZ}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - assistant
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  # --- Automation Center frontend (local mode only; Vercel hosts production) ---
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:${BACKEND_PORT:-8080}}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:${BACKEND_PORT:-8080}}
        VITE_APP_ENV: local
    image: pa-automation-center-frontend:local
    container_name: pa-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - assistant
    healthcheck:
      # 127.0.0.1, not localhost: inside the container `localhost` resolves to
      # ::1 first and nginx only listens on IPv4, so the check would fail while
      # the site is perfectly up.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  n8n_data:

networks:
  assistant:
    name: personal_assistant_network
    driver: bridge
