[project]
name = "automation-center-backend"
version = "3.0.0"
description = "Automation Center - backend API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "python-multipart==0.0.20",
    "argon2-cffi==23.1.0",
    "PyJWT==2.10.1",
    "cryptography==44.0.0",
    "httpx==0.28.1",
    "psutil==6.1.1",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "anyio==4.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests hit a real n8n and are opt-in: run them with
#   pytest -m integration
# (a later -m on the CLI overrides the default below).
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs a real Postgres / n8n (opt-in: pytest -m integration)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
